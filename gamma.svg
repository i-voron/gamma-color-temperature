<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple background / Фиолетовый фон -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="#7C3AED"/>
  
  <!-- Slider tracks / Полоски слайдеров (шире) -->
  <!-- Red slider / Красный слайдер -->
  <rect x="32" y="42" width="192" height="45" rx="18" ry="18" fill="#EF4444"/>
  <rect x="140" y="42" width="84" height="45" rx="18" ry="18" fill="#EF4444" opacity="0.4"/>
  
  <!-- Green slider / Зелёный слайдер -->
  <rect x="32" y="110" width="192" height="45" rx="18" ry="18" fill="#22C55E"/>
  <rect x="170" y="110" width="54" height="45" rx="18" ry="18" fill="#22C55E" opacity="0.4"/>
  
  <!-- Blue slider / Синий слайдер -->
  <rect x="32" y="178" width="192" height="45" rx="18" ry="18" fill="#3B82F6"/>
  <rect x="110" y="178" width="114" height="45" rx="18" ry="18" fill="#3B82F6" opacity="0.4"/>
  
  <!-- White knobs / Белые кружки -->
  <circle cx="140" cy="64" r="28" fill="#FFFFFF"/>
  <circle cx="170" cy="133" r="28" fill="#FFFFFF"/>
  <circle cx="110" cy="200" r="28" fill="#FFFFFF"/>
</svg>